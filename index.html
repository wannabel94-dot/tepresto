<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TePresto</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f7f7f7; }
    header { background: #4CAF50; color: white; text-align: center; padding: 2rem 1rem; }
    header h1 { margin-bottom: 0.5rem; font-size: 2.2rem; }
    main { max-width: 600px; margin: 2rem auto; padding: 1rem; text-align: center; }
    .cta-button { display: inline-block; padding: 1rem 2rem; font-size: 1.2rem; background: #4CAF50; color: white; border-radius: 8px; text-decoration: none; transition: background 0.3s; margin-bottom: 2rem; }
    .cta-button:hover { background: #45a049; }
    .search-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; justify-content: center; margin-bottom: 2rem; }
    .search-bar input[type="text"] { flex: 1; padding: 0.8rem; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc; min-width: 150px; }
    .search-bar button { padding: 0.8rem 1.5rem; font-size: 1rem; border-radius: 5px; border: none; background: #4CAF50; color: white; cursor: pointer; transition: background 0.3s; }
    .search-bar button:hover { background: #45a049; }
    footer { text-align: center; margin: 2rem 0; font-size: 0.9rem; color: #777; }
    @media (max-width: 500px) { .search-bar { flex-direction: column; } .cta-button { width: 100%; margin-bottom: 1rem; } }
  </style>
</head>
<body>

<header>
  <h1>TePresto</h1>
  <p>Borrow or lend items easily with your community.</p>
</header>

<main>
  <a href="listing.html" class="cta-button">List an Item</a>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search for an item to rent...">
    <button id="searchBtn">Search</button>
  </div>
</main>

<footer>
  &copy; 2026 TePresto. All rights reserved.
</footer>

<script>
  const searchInput = document.getElementById('searchInput');
  const searchBtn = document.getElementById('searchBtn');

  function goToResults() {
    const query = encodeURIComponent(searchInput.value.trim());
    if(query) {
      window.location.href = `results.html?query=${query}`;
    } else {
      alert('Please enter a search term.');
    }
  }

  searchBtn.addEventListener('click', goToResults);
  searchInput.addEventListener('keypress', e => {
    if(e.key === 'Enter') goToResults();
  });
</script>

</body>
</html>
