<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Profile - TePresto</title>
<style>
body { font-family: Arial, sans-serif; background:#f7f7f7; margin:0; padding:0; }
main { max-width:500px; margin:3rem auto; background:white; padding:2rem; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
h1 { text-align:center; margin-bottom:1rem; }
input, button { width:100%; padding:0.8rem; margin-bottom:1rem; border-radius:5px; border:1px solid #ccc; font-size:1rem; }
button { background:#4CAF50; color:white; border:none; cursor:pointer; transition:background 0.3s; }
button:hover { background:#45a049; }
</style>
</head>
<body>

<main>
<h1>Create Your Profile</h1>
<form id="createProfileForm">
  <input type="text" id="userName" placeholder="Full Name" required>
  <input type="email" id="userEmail" placeholder="Email" required>
  <input type="password" id="userPassword" placeholder="Password" required>
  <button type="submit">Create Profile</button>
</form>
</main>

<script>
const form = document.getElementById('createProfileForm');

form.addEventListener('submit', e => {
  e.preventDefault();

  const name = document.getElementById('userName').value.trim();
  const email = document.getElementById('userEmail').value.trim();
  const password = document.getElementById('userPassword').value;

  if(!name || !email || !password) return alert('Please fill all fields.');

  // Create user object
  const user = {
    id: Date.now(),  // simple unique ID
    name,
    email,
    password,
    listings: []     // user's listings stored here
  };

  // Save user to localStorage
  let users = JSON.parse(localStorage.getItem('users')) || [];
  users.push(user);
  localStorage.setItem('users', JSON.stringify(users));

  alert('Profile created!');
  // Optional: redirect to landing page or login page
  window.location.href = 'index.html';
});
</script>

</body>
</html>
