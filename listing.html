<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TePresto - List Item</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif; }
body { background:#f7f7f7; color:#333; line-height:1.6; }
header { background:#4CAF50; color:white; padding:1rem; text-align:center; }
main { max-width:600px; margin:2rem auto; padding:1rem; background:white; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
h1 { margin-bottom:1rem; font-size:1.8rem; text-align:center; }
form { display:flex; flex-direction:column; gap:1rem; }
input, textarea, select, button { padding:0.8rem; font-size:1rem; border:1px solid #ccc; border-radius:5px; }
button { background:#4CAF50; color:white; border:none; cursor:pointer; transition:background 0.3s; }
button:hover { background:#45a049; }
#imagePreview { display:flex; gap:1rem; flex-wrap:wrap; }
#imagePreview img { width:100px; height:100px; object-fit:cover; border-radius:5px; }
@media(max-width:500px){ main { margin:1rem; padding:1rem; } #imagePreview img { width:80px; height:80px; } }
</style>
</head>
<body>

<header><h2>TePresto</h2></header>

<main>
<h1>List Your Item</h1>
<form id="rentalForm">
  <input type="text" id="itemName" placeholder="Item Name" required>
  <textarea id="itemDescription" placeholder="Item Description" rows="3" required></textarea>
  <input type="number" id="itemPrice" placeholder="Rental Price per Day (€)" min="0" required>
  <input type="number" id="itemDeposit" placeholder="Deposit (optional)" min="0">
  <select id="itemCategory" required>
    <option value="">Select Category</option>
    <option value="tools">Tools</option>
    <option value="electronics">Electronics</option>
    <option value="cleaning">Cleaning Equipment</option>
    <option value="other">Other</option>
  </select>

  <label><input type="checkbox" id="pickupCheckbox"> Allow Dropoff/Pickup</label>
  <input type="text" id="itemLocation" placeholder="Item Location" required>

  <label>Upload Images (at least 1 required): <input type="file" id="imageUpload" accept="image/*" multiple required></label>
  <div id="imagePreview"></div>

  <button type="submit">List Item</button>
</form>
</main>

<footer>&copy; 2026 TePresto. All rights reserved.</footer>

<!-- Google Maps API for location autocomplete -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
<script>
const form = document.getElementById('rentalForm');
const imageUpload = document.getElementById('imageUpload');
const imagePreview = document.getElementById('imagePreview');

// Image preview
imageUpload.addEventListener('change', () => {
  imagePreview.innerHTML = '';
  Array.from(imageUpload.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = document.createElement('img');
      img.src = e.target.result;
      imagePreview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
});

// Google Maps autocomplete
const locationInput = document.getElementById('itemLocation');
new google.maps.places.Autocomplete(locationInput, { types: ['geocode'] });

// Handle form submission
form.addEventListener('submit', (e) => {
  e.preventDefault();
  if(imageUpload.files.length === 0) return alert('Please upload at least one image.');
  if(locationInput.value.trim() === '') return alert('Please enter the item location.');

  // Store listing in localStorage
  let listings = JSON.parse(localStorage.getItem('listings')) || [];
  listings.push({
    name: document.getElementById('itemName').value,
    description: document.getElementById('itemDescription').value,
    price: parseFloat(document.getElementById('itemPrice').value),
    deposit: parseFloat(document.getElementById('itemDeposit').value) || 0,
    category: document.getElementById('itemCategory').value,
    pickup: document.getElementById('pickupCheckbox').checked,
    location: locationInput.value,
    images: Array.from(imageUpload.files).map(f => f.name) // For demo only
  });
  localStorage.setItem('listings', JSON.stringify(listings));

  alert('Item listed!');
  form.reset();
  imagePreview.innerHTML = '';
});
</script>
</body>
</html>
