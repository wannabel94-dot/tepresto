<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TePresto - List Item</title>
<style>
* { box-sizing: border-box; margin:0; padding:0; font-family: Arial, sans-serif; }
body { background:#f7f7f7; color:#333; line-height:1.6; }
header { background:#4CAF50; color:white; padding:1rem; text-align:center; }
main { max-width:600px; margin:2rem auto; padding:1rem; background:white; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); }
h1 { margin-bottom:1rem; font-size:1.8rem; text-align:center; }
form { display:flex; flex-direction:column; gap:1rem; }
input, textarea, select, button { padding:0.8rem; font-size:1rem; border:1px solid #ccc; border-radius:5px; }
button { background:#4CAF50; color:white; border:none; cursor:pointer; transition:background 0.3s; }
button:hover { background:#45a049; }
#imagePreview { display:flex; gap:1rem; flex-wrap:wrap; }
#imagePreview img { width:100px; height:100px; object-fit:cover; border-radius:5px; }
@media(max-width:500px){ main { margin:1rem; padding:1rem; } #imagePreview img { width:80px; height:80px; } }
</style>
</head>
<body>

<header>
<h2>TePresto</h2>
</header>

<main>
<h1>List Your Item</h1>
<form id="rentalForm">
  <input type="text" placeholder="Item Name" required>
  <textarea placeholder="Item Description" rows="3" required></textarea>
  <input type="number" placeholder="Rental Price per Day (€)" min="0" required>
  <input type="number" placeholder="Deposit (e.g., €0 or optional security deposit)" min="0">
  <select required>
    <option value="">Select Category</option>
    <option value="tools">Tools</option>
    <option value="electronics">Electronics</option>
    <option value="cleaning">Cleaning Equipment</option>
    <option value="other">Other</option>
  </select>

  <label>
    <input type="checkbox" id="pickupCheckbox">
    Allow Dropoff/Pickup
  </label>

  <!-- Location field -->
  <input type="text" id="itemLocation" placeholder="Item Location" required>

  <!-- Image upload -->
  <label>
    Upload Images (at least 1 required):
    <input type="file" id="imageUpload" accept="image/*" multiple required>
  </label>
  <div id="imagePreview"></div>

  <button type="submit">List Item</button>
</form>
</main>

<footer>
&copy; 2026 TePresto. All rights reserved.
</footer>

<!-- Google Maps API -->
<script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&libraries=places"></script>
<script>
  const form = document.getElementById('rentalForm');
  const imageUpload = document.getElementById('imageUpload');
  const imagePreview = document.getElementById('imagePreview');

  // Image preview
  imageUpload.addEventListener('change', () => {
    imagePreview.innerHTML = '';
    Array.from(imageUpload.files).forEach(file => {
      const reader = new FileReader();
      reader.onload = e => {
        const img = document.createElement('img');
        img.src = e.target.result;
        imagePreview.appendChild(img);
      };
      reader.readAsDataURL(file);
    });
  });

  // Google Maps autocomplete for location
  const locationInput = document.getElementById('itemLocation');
  const autocomplete = new google.maps.places.Autocomplete(locationInput, {
    types: ['geocode'] // Only addresses
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    // Ensure at least one image
    if(imageUpload.files.length === 0){
      alert('Please upload at least one image.');
      return;
    }
    // Ensure location filled
    if(locationInput.value.trim() === ''){
      alert('Please enter the item location.');
      return;
    }
    alert('Item listed! (Functionality to connect to backend)');
    form.reset();
    imagePreview.innerHTML = '';
  });
</script>

</body>
</html>
